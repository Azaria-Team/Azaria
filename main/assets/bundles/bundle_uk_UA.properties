block.azaria-magnetic-overflow-gate.description = Only outputs items to the left and right if the front path is blocked.

block.azaria-magnetic-underflow-gate.name = Magnetic Underflow Gate.
block.azaria-magnetic-underflow-gate.description = Opposite of an overflow gate. Outputs to the front if the left and right paths are blocked.

